---
# cPanel Git deployment — FoodOS
#
# BEFORE FIRST DEPLOY, edit DEPLOYPATH below:
#   1. cPanel → Domains → your domain → note "Document Root"
#   2. Replace CPANEL_USERNAME and the path to match that folder
#
# Examples:
#   Main site in subfolder:  /home/username/public_html/foodos
#   Addon domain root:       /home/username/food.yourdomain.com
#   Entire main domain:      /home/username/public_html
#
# "Uncommitted changes" on server: cPanel → Terminal, then:
#   cd /path/to/your/git/repo
#   git fetch && git reset --hard origin/main
#
deployment:
  tasks:
    - export DEPLOYPATH=/home/onukromx/public_html/foodos
    - /bin/mkdir -p $DEPLOYPATH/assets/uploads/profiles $DEPLOYPATH/assets/uploads/restaurants $DEPLOYPATH/assets/uploads/menu
    - /bin/cp index.php $DEPLOYPATH/
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp -R api $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R controllers $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R includes $DEPLOYPATH
    - /bin/cp -R models $DEPLOYPATH
    - /bin/cp -R views $DEPLOYPATH
